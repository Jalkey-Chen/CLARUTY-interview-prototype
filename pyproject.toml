[project]
name = "clarity-patient-dashboard"
version = "0.1.0"
description = "Local Streamlit prototype for the CLARITY Patient Explainer Dashboard interview demo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "python-docx",
    "streamlit",
    "anthropic>=1.9.0",
    "fpdf2>=2.8.8",
    "imageio-ffmpeg>=0.6.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
